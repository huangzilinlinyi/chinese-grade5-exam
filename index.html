function extraQuestions(lesson){
  const arr=[];

  arr.push({
    type:"选择题",
    q:`关于《${lesson.name}》，下列理解最准确的一项是：`,
    opts:[
      `文章不仅写事情，还通过具体细节表现人物、景物或思想感情`,
      `文章只是在介绍课文中的几个词语`,
      `文章主要是为了介绍作者的家庭情况`,
      `文章没有表达任何思想感情`
    ],
    a:0
  });

  arr.push({
    type:"选择题",
    q:`学习《${lesson.name}》时，最值得关注的学习重点是：`,
    opts:[
      lesson.focus,
      "只记住作者姓名",
      "只记住课文页码",
      "只背诵所有标点符号"
    ],
    a:0
  });

  arr.push({
    type:"判断题",
    q:`《${lesson.name}》中的内容需要结合具体语境理解，不能只看单个词语。`,
    opts:["正确","错误"],
    a:0
  });

  arr.push({
    type:"判断题",
    q:`阅读《${lesson.name}》时，只要记住故事结果，就完全不需要关注人物的语言、动作和心理。`,
    opts:["正确","错误"],
    a:1
  });

  arr.push({
    type:"填空题",
    q:`《${lesson.name}》的学习重点之一是理解课文表达的${lesson.focus}。`,
    answer:lesson.focus
  });

  arr.push({
    type:"简答题",
    q:`请用一句话概括《${lesson.name}》给你的最大启发。`,
    answer:""
  });

  return arr;
}

function convertLesson(lesson){
  let qs=[];

  lesson.qs.forEach(x=>{
    qs.push({
      type:"选择题",
      q:x[0],
      opts:x.slice(1),
      a:0
    });
  });

  lesson.tf.forEach(x=>{
    qs.push({
      type:"判断题",
      q:x[0],
      opts:["正确","错误"],
      a:x[1]==="对"?0:1
    });
  });

  lesson.fill.forEach(x=>{
    qs.push({
      type:"填空题",
      q:x[0],
      answer:x[1]
    });
  });

  extraQuestions(lesson).forEach(x=>qs.push(x));

  return qs;
}

    const btn=document.createElement("button");
    btn.className="lesson";
    btn.innerHTML=`
      <div class="lesson-num">第 ${lesson.n} 课</div>
      <div class="lesson-name">${lesson.name}</div>
      <div class="lesson-count">${convertLesson(lesson).length} 题 · ${lesson.focus}</div>
    `;
    btn.onclick=()=>startExam(index);
    lessonGrid.appendChild(btn);
  });

  renderHistory();
}

function startExam(index){
  currentLesson=lessons[index];
  currentQuestions=convertLesson(currentLesson);

  answers={};
  submitted=false;

  document.getElementById("home").classList.add("hide");
  document.getElementById("resultPage").classList.add("hide");
  document.getElementById("exam").classList.remove("hide");

  document.getElementById("examTitle").innerHTML=`
    <div style="font-size:12px;color:#536dfe;font-weight:bold">
      第 ${currentLesson.n} 课
    </div>
    <h2 style="margin:7px 0">${currentLesson.name}</h2>
    <div class="small">
      学习重点：${currentLesson.focus}
      <br>
      本卷共 ${currentQuestions.length} 题
    </div>
  `;

  renderQuestions();
  window.scrollTo(0,0);
}

function renderQuestions(){
  const box=document.getElementById("questions");
  box.innerHTML="";

  currentQuestions.forEach((q,i)=>{
    const card=document.createElement("div");
    card.className="question-card";

    let html=`
      <div class="qtype">${q.type}</div>
      <div class="qtitle">${i+1}. ${q.q}</div>
    `;

    if(q.type==="选择题" || q.type==="判断题"){
      q.opts.forEach((op,j)=>{
        html+=`
          <button
            class="option"
            id="q${i}o${j}"
            onclick="selectOption(${i},${j})">
            ${String.fromCharCode(65+j)}. ${op}
          </button>
        `;
      });
    }

    if(q.type==="填空题"){
      html+=`
        <input
          class="answer"
          id="input${i}"
          placeholder="请输入答案"
          autocomplete="off">
      `;
    }

    if(q.type==="简答题"){
      html+=`
        <textarea
          class="answer"
          id="input${i}"
          placeholder="请输入你的答案"></textarea>
      `;
    }

    card.innerHTML=html;
    box.appendChild(card);
  });

  updateProgress();
}

function selectOption(qi,oi){
  if(submitted)return;

  answers[qi]=oi;

  const q=currentQuestions[qi];

  q.opts.forEach((_,j)=>{
    const el=document.getElementById(`q${qi}o${j}`);
    if(el)el.classList.remove("selected");
  });

  const selected=document.getElementById(`q${qi}o${oi}`);
  if(selected)selected.classList.add("selected");

  updateProgress();
}

function updateProgress(){
  let done=Object.keys(answers).length;

  currentQuestions.forEach((q,i)=>{
    if((q.type==="填空题" || q.type==="简答题")){
      const el=document.getElementById(`input${i}`);
      if(el && el.value.trim())done++;
    }
  });

  const percent=Math.round(done/currentQuestions.length*100);

  document.getElementById("progress").style.width=percent+"%";
  document.getElementById("progressText").textContent=
    `${done}/${currentQuestions.length}`;
}

document.addEventListener("input",()=>{
  if(!submitted)updateProgress();
});

function normalize(str){
  return String(str||"")
    .replace(/\s/g,"")
    .replace(/[，。！？、；：""''“”‘’（）()]/g,"")
    .toLowerCase();
}

function submitExam(){

  if(submitted)return;

  if(!confirm("确定要提交这套试卷吗？提交后将显示成绩。")){
    return;
  }

  submitted=true;

  let score=0;
  let total=currentQuestions.length;
  let mistakes=[];

  currentQuestions.forEach((q,i)=>{

    if(q.type==="选择题" || q.type==="判断题"){
      const user=answers[i];

      if(user===q.a){
        score++;
      }else{
        mistakes.push({
          q:i,
          reason:"正确答案："+q.opts[q.a]
        });
      }
    }

    else if(q.type==="填空题"){
      const input=document.getElementById("input"+i);
      const user=normalize(input ? input.value : "");

      if(user && normalize(q.answer)===user){
        score++;
      }else{
        mistakes.push({
          q:i,
          reason:"参考答案："+q.answer
        });
      }
    }

    else if(q.type==="简答题"){
      const input=document.getElementById("input"+i);
      const user=input ? input.value.trim() : "";

      if(user.length>=8){
        score++;
      }else{
        mistakes.push({
          q:i,
          reason:"建议认真组织语言，至少写出完整意思。"
        });
      }
    }
  });

  const percent=Math.round(score/total*100);

  saveHistory(currentLesson.n,currentLesson.name,percent);

  showResult(score,total,percent,mistakes);
}

function showResult(score,total,percent,mistakes){

  document.getElementById("exam").classList.add("hide");
  document.getElementById("resultPage").classList.remove("hide");

  let star="⭐";

  if(percent>=95)star="⭐⭐⭐⭐⭐";
  else if(percent>=85)star="⭐⭐⭐⭐";
  else if(percent>=70)star="⭐⭐⭐";
  else if(percent>=60)star="⭐⭐";
  else star="⭐";

  let comment="继续努力！";

  if(percent>=95)comment="太厉害了！这一课已经掌握得非常扎实！";
  else if(percent>=85)comment="表现很好，再检查一下错题会更棒！";
  else if(percent>=70)comment="基础不错，重点复习错题。";
  else if(percent>=60)comment="已经完成了考试，再认真复习一次。";
  else comment="别着急，把错题重新学习一遍，再来挑战！";

  let mistakeHTML="";

  if(mistakes.length){
    mistakeHTML=`
      <div style="text-align:left;margin-top:20px">
        <h3>❌ 本次需要复习：${mistakes.length} 题</h3>
    `;

    mistakes.forEach(m=>{
      mistakeHTML+=`
        <div class="analysis">
          第 ${m.q+1} 题：${m.reason}
        </div>
      `;
    });

    mistakeHTML+=`</div>`;
  }else{
    mistakeHTML=`
      <div class="analysis">
        🎉 太棒了！本套试卷全部正确！
      </div>
    `;
  }

  document.getElementById("resultBox").innerHTML=`
    <div style="font-size:15px;color:#78909c">
      第 ${currentLesson.n} 课 · ${currentLesson.name}
    </div>

    <div class="score">${percent}</div>

    <div>得分率</div>

    <div class="stars">${star}</div>

    <h3>${comment}</h3>

    <div class="analysis">
      正确：${score} 题　
      错误：${total-score} 题　
      总题数：${total} 题
    </div>

    ${mistakeHTML}

    <div style="margin-top:25px;display:flex;gap:8px">
      <button class="btn secondary" style="flex:1" onclick="retry()">
        🔄 再做一次
      </button>

      <button class="btn primary" style="flex:1" onclick="goHome()">
        📚 选择下一课
      </button>
    </div>
  `;

  window.scrollTo(0,0);
}

function retry(){
  const index=lessons.findIndex(x=>x.n===currentLesson.n);
  startExam(index);
}

function goHome(){
  document.getElementById("exam").classList.add("hide");
  document.getElementById("resultPage").classList.add("hide");
  document.getElementById("home").classList.remove("hide");

  renderHistory();
  window.scrollTo(0,0);
}

function saveHistory(n,name,score){

  let data=JSON.parse(
    localStorage.getItem("grade5ExamHistory")||"{}"
  );

  data[n]={
    name:name,
    score:score,
    time:new Date().toLocaleString()
  };

  localStorage.setItem(
    "grade5ExamHistory",
    JSON.stringify(data)
  );
}

function renderHistory(){

  const box=document.getElementById("history");

  let data=JSON.parse(
    localStorage.getItem("grade5ExamHistory")||"{}"
  );

  if(!Object.keys(data).length){
    box.innerHTML=
      `<div class="small">还没有考试记录，先选择一篇课文开始吧。</div>`;
    return;
  }

  let html="";

  lessons.forEach(l=>{
    if(data[l.n]){
      const d=data[l.n];

      let level="需要复习";

      if(d.score>=95)level="优秀";
      else if(d.score>=85)level="良好";
      else if(d.score>=70)level="掌握";
      else if(d.score>=60)level="及格";

      html+=`
        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          padding:10px 0;
          border-bottom:1px solid #eee;
        ">
          <div>
            <b>第${l.n}课 ${l.name}</b>
            <div class="small">${d.time}</div>
          </div>
          <div style="text-align:right">
            <b style="color:#536dfe;font-size:19px">
              ${d.score}
            </b>
            <div class="small">${level}</div>
          </div>
        </div>
      `;
    }
  });

  box.innerHTML=html;
}

renderLessons();

</script>
