<html lang="zh-CN">
<head>

<title>五年级上册语文学习</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;
    background:#f4f6f8;
    color:#333;
}

/* 顶部 */
.header{
    background:linear-gradient(135deg,#e67e22,#f39c12);
    color:white;
    padding:28px 20px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header h1{
    font-size:26px;
    margin-bottom:8px;
}

.header p{
    font-size:14px;
    opacity:.9;
}

/* 进度 */
.progress-box{
    background:white;
    margin:18px;
    padding:18px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.progress-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:15px;
    font-weight:bold;
}

.progress-bar{
    width:100%;
    height:12px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#27ae60,#2ecc71);
    border-radius:20px;
    transition:.4s;
}

/* 搜索 */
.search-box{
    margin:0 18px 20px;
}

.search-box input{
    width:100%;
    padding:14px 16px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

/* 主体 */
.container{
    max-width:900px;
    margin:auto;
    padding:0 18px 40px;
}

/* 单元 */
.unit{
    margin-bottom:22px;
}

.unit-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
    color:#444;
}

.unit-icon{
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff3e0;
    border-radius:10px;
}

/* 课文卡片 */
.lesson{
    background:white;
    border-radius:14px;
    margin-bottom:10px;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.lesson:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,0,0,.1);
}

.lesson-left{
    display:flex;
    align-items:center;
    gap:13px;
}

.lesson-number{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#fff3e0;
    color:#e67e22;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.lesson-name{
    font-size:17px;
    font-weight:bold;
}

.lesson-type{
    font-size:12px;
    color:#999;
    margin-top:4px;
}

.status{
    font-size:22px;
}

.done{
    color:#27ae60;
}

/* 特殊栏目 */
.extra{
    background:#fff;
    border-left:5px solid #f39c12;
    padding:13px 16px;
    border-radius:10px;
    margin-bottom:10px;
    color:#666;
    font-size:15px;
}

/* 底部 */
.footer{
    text-align:center;
    color:#999;
    font-size:13px;
    padding:20px;
}

/* =====================================================
   当前试卷
===================================================== */

let currentLesson = null;


/* =====================================================
   打开课文
===================================================== */

function openLesson(id,name,unit){

    currentLesson = id;

    document.getElementById("homePage").style.display="none";
    document.getElementById("studyPage").style.display="block";

    document.getElementById("lessonTitle").innerText =
        name + " · 课文试卷";

    document.getElementById("lessonUnit").innerText =
        unit + " · 满分100分";

    renderQuiz(id);

    window.scrollTo(0,0);
}


/* =====================================================
   生成试卷
===================================================== */

function renderQuiz(id){

    const data = quizData[id];

    if(!data){
        document.getElementById("quizArea").innerHTML =
        "<p>暂时没有找到这篇课文的试卷。</p>";
        return;
    }

    let html = `
        <div class="quiz-intro">
            📖 <b>${data.title}</b>课文专项测试<br>
            共10题，每题10分，满分100分。<br>
            请认真阅读题目后再选择答案。
        </div>
    `;

    data.questions.forEach((item,index)=>{

        html += `
        <div class="question" id="question${index}">
            <div class="question-title">
                ${item.q}
            </div>
        `;

        if(item.type === "choice"){

            item.options.forEach(option=>{

                const letter = option.charAt(0);

                html += `
                <label class="option">
                    <input
                        type="radio"
                        name="q${index}"
                        value="${letter}">
                    ${option}
                </label>
                `;

            });

        }

        if(item.type === "fill"){

            html += `
                <input
                    class="fill-input"
                    id="fill${index}"
                    type="text"
                    placeholder="请输入答案">
            `;

        }

        html += `
            <div class="answer-box" id="answer${index}">
                ✅ 正确答案：${item.answer}
            </div>
        </div>
        `;

    });

    document.getElementById("quizArea").innerHTML=html;

    document.getElementById("resultArea").innerHTML="";

    document.getElementById("submitBtn").style.display="block";

    document.getElementById("retryBtn").style.display="none";
}


/* =====================================================
   提交试卷
===================================================== */

function submitQuiz(){

    const data = quizData[currentLesson];

    if(!data) return;

    let score = 0;
    let answered = 0;

    data.questions.forEach((item,index)=>{

        let userAnswer="";

        if(item.type==="choice"){

            const selected =
                document.querySelector(
                    `input[name="q${index}"]:checked`
                );

            if(selected){

                userAnswer=selected.value;
                answered++;

            }

        }

        if(item.type==="fill"){

            const input =
                document.getElementById("fill"+index);

            if(input){

                userAnswer=input.value.trim();

                if(userAnswer){
                    answered++;
                }

            }

        }


        const question =
            document.getElementById(
                "question"+index
            );

        const answerBox =
            document.getElementById(
                "answer"+index
            );


        /* 判断 */

        if(userAnswer === item.answer){

            score += 10;

            question.classList.add("correct");

        }else{

            question.classList.add("wrong");

            answerBox.style.display="block";

        }

    });


    /* 防止空题直接提交 */

    if(answered < data.questions.length){

        const ok =
            confirm(
                "还有 " +
                (data.questions.length-answered) +
                " 道题没有完成，确定要交卷吗？"
            );

        if(!ok) return;

    }


    let level="";

    if(score>=90){

        level="🏆 太棒了！优秀！";

    }else if(score>=80){

        level="🌟 很不错！继续努力！";

    }else if(score>=60){

        level="👍 及格了，再认真复习一下！";

    }else{

        level="💪 不要灰心，再挑战一次！";

    }


    document.getElementById("resultArea").innerHTML=`

        <div class="result-card">

            <div class="result-text">
                ${level}
            </div>

            <div class="result-score">
                ${score}分
            </div>

            <div>
                共10题 · 答对 ${score/10} 题
            </div>

            <div class="quiz-tip">
                错题已经在下面显示正确答案。
            </div>

        </div>

    `;


    document.getElementById("submitBtn").style.display="none";

    document.getElementById("retryBtn").style.display="block";


    /* 保存最高成绩 */

    let scores =
        JSON.parse(
            localStorage.getItem("lessonScores")
        ) || {};

    if(
        !scores[currentLesson] ||
        score > scores[currentLesson]
    ){

        scores[currentLesson]=score;

        localStorage.setItem(
            "lessonScores",
            JSON.stringify(scores)
        );

    }


    /* 做过试卷就算完成 */

    let completed =
        JSON.parse(
            localStorage.getItem("completedLessons")
        ) || [];

    if(!completed.includes(currentLesson)){

        completed.push(currentLesson);

        localStorage.setItem(
            "completedLessons",
            JSON.stringify(completed)
        );

    }

    updateProgress();

    window.scrollTo(0,0);

}


/* =====================================================
   重新挑战
===================================================== */

function retryQuiz(){

    renderQuiz(currentLesson);

    window.scrollTo(0,0);

}


/* =====================================================
   返回首页
===================================================== */

function goHome(){

    document.getElementById("studyPage").style.display="none";

    document.getElementById("homePage").style.display="block";

    updateProgress();

    window.scrollTo(0,0);

}


/* =====================================================
   更新学习进度
===================================================== */

function updateProgress(){

    let completed =
        JSON.parse(
            localStorage.getItem("completedLessons")
        ) || [];

    let total=25;

    let count=completed.length;

    document.getElementById("progressText").innerText =
        count+" / "+total;

    document.getElementById("progressBar").style.width =
        (count/total*100)+"%";


    for(let i=1;i<=total;i++){

        const status =
            document.getElementById("status"+i);

        if(status){

            if(completed.includes(i)){

                status.innerText="✓";

                status.classList.add("done");

            }else{

                status.innerText="○";

                status.classList.remove("done");

            }

        }

    }

}


/* =====================================================
   搜索课文
===================================================== */

function searchLesson(){

    let keyword =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    let lessons =
        document.querySelectorAll(".lesson");


    lessons.forEach(function(lesson){

        let name =
            lesson
            .getAttribute("data-name")
            .toLowerCase();


        if(name.includes(keyword)){

            lesson.style.display="flex";

        }else{

            lesson.style.display="none";

        }

    });

}


/* =====================================================
   初始化
===================================================== */

updateProgress();
