{type:"spell",lesson:"2 落花生",p:"fēn fù",a:"吩咐",tip:"“吩咐”是说话、交代事情，所以两个字都有“口”字旁。"},

{type:"spell",lesson:"6 将相和",p:"fù jīng qǐng zuì",a:"负荆请罪",tip:"“荆”是荆条。记故事：廉颇背着荆条来认错，所以是“负荆请罪”。"},

{type:"spell",lesson:"7 什么比猎豹的速度更快",p:"chì dào",a:"赤道",tip:"“赤”有红色、裸露之意。地球中间的一条纬线叫赤道，记“赤道在地球中间”。"},
{type:"spell",lesson:"8 冀中的地道战",p:"qīn lüè",a:"侵略",tip:"“侵”左边是单人旁，和人有关；“略”不是“掠”。记：侵略=侵犯、抢夺别人的地方。"},
{type:"spell",lesson:"8 冀中的地道战",p:"yǐn bì",a:"隐蔽",tip:"“隐”是隐藏；“蔽”有遮挡的意思。记：藏起来、不容易被发现→隐蔽。"},
{type:"spell",lesson:"9 猎人海力布",p:"chóu xiè",a:"酬谢",tip:"“酬”左边是酉，常和酒、宴饮、报答联系；“谢”就是感谢。记：为了感谢而给予报答。"},
{type:"spell",lesson:"9 猎人海力布",p:"bēng tā",a:"崩塌",tip:"“崩”有山字底，山体垮下来叫崩塌。记：山崩、地塌。"},
{type:"spell",lesson:"10 牛郎织女（一）",p:"xiāo zi",a:"嫂子",tip:"“嫂”是女性称谓，女字旁。记：哥哥的妻子叫嫂子。"},
{type:"spell",lesson:"10 牛郎织女（一）",p:"xī hǎn",a:"稀罕",tip:"“罕”容易少写一笔。记：稀罕=稀奇、觉得珍贵。"},
{type:"spell",lesson:"11 牛郎织女（二）",p:"xiāng yī wéi mìng",a:"相依为命",tip:"“依”是依靠。记：彼此依靠着生活，就是相依为命。"},
{type:"spell",lesson:"12 古诗三首",p:"jǐ hài zá shī",a:"己亥杂诗",tip:"“己”是自己；“亥”是地支之一。记诗题时注意“己”不要写成“已”。"},

{type:"spell",lesson:"16 太阳",p:"shè shì dù",a:"摄氏度",tip:"“摄”不要写成“射”。温度单位“摄氏度”固定写法。"},

{type:"choice",lesson:"19 父爱之舟",q:"“父爱之舟”中的“舟”主要象征（  ）。",opts:["父亲对孩子深沉的爱与陪伴","一次普通旅行","财富","比赛"],a:0,tip:"“舟”贯穿作者的成长回忆，承载的是父亲深沉而无言的爱。"},

const extra=[
{type:"fill",lesson:"12 古诗三首",q:"补写诗句：我劝天公重抖擞，__________。",a:"不拘一格降人才",tip:"这是《己亥杂诗》。记住“天公抖擞”后，接“降人才”，意思是希望天公不要拘泥常规降下人才。"},
{type:"fill",lesson:"12 古诗三首",q:"补写诗句：王师北定中原日，__________。",a:"家祭无忘告乃翁",tip:"《示儿》结尾。记：国家收复失地的那天，别忘了祭祀时告诉我这个老人。"},

{type:"fill",lesson:"14 圆明园的毁灭",q:"补写词语：众星__________月",a:"拱",tip:"“拱”有环绕、围绕的意思。许多星星围着月亮→众星拱月。"},

{type:"fill",lesson:"26 忆读书",q:"读书好，多读书，__________。",a:"读好书",tip:"这是全文非常重要的总结句，三个“读”字串起来记：读书好→多读书→读好书。"},
{type:"fill",lesson:"27 我的“长生果”",q:"书，被人们称为人类文明的“__________”。",a:"长生果",tip:"“长生果”比喻书籍能给人持续的精神滋养。"}
];

const all=[...qs,...basic,...extra];

function norm(s){return String(s||"").trim().replace(/[，。！？；：“”‘’、,.!?;:"'\\s]/g,"");}
function renderLessons(){
 document.getElementById("lessons").innerHTML=lessons.map(u=>`<div class="lesson"><b>${u[0]}</b><br>${u.slice(1).join("　")}</div>`).join("");
}
function renderExam(list=all){
 const form=document.getElementById("exam");
 form.innerHTML="";
 let sec="";
 const spell=list.filter(x=>x.type==="spell"), choice=list.filter(x=>x.type==="choice"), fill=list.filter(x=>x.type==="fill");
 sec+=`<div class="panel"><h2>一、生字词语：看拼音写词语（${spell.length}题）</h2><p class="small">请直接输入完整词语。这里是本卷重点。</p>`;
 spell.forEach((x,i)=>sec+=`<div class="q" data-key="${x.lesson}|${x.p}"><span class="num">${i+1}.</span><span class="tag">${x.lesson}</span><div style="margin-top:8px">看拼音写词语：<b>${x.p}</b></div><input type="text" id="s${i}" autocomplete="off" spellcheck="false" placeholder="请输入词语"></div>`);
 sec+=`</div>`;
 sec+=`<div class="panel"><h2>二、课文基础判断（${choice.length}题）</h2><p class="small">选择正确答案即可，不建议猜，先读题再作答。</p>`;
 choice.forEach((x,i)=>sec+=`<div class="q"><span class="num">${i+1}.</span><span class="tag">${x.lesson}</span><div style="margin-top:8px"><b>${x.q}</b></div><div class="choice">${x.opts.map((o,j)=>`<label><input type="radio" name="c${i}" value="${j}">${String.fromCharCode(65+j)}. ${o}</label>`).join("")}</div></div>`);
 sec+=`</div>`;
 sec+=`<div class="panel"><h2>三、基础积累：补写词语或句子（${fill.length}题）</h2>`;
 fill.forEach((x,i)=>sec+=`<div class="q"><span class="num">${i+1}.</span><span class="tag">${x.lesson}</span><div style="margin-top:8px"><b>${x.q}</b></div><input type="text" id="f${i}" autocomplete="off" spellcheck="false" placeholder="请输入答案"></div>`);
 sec+=`</div>`;
 sec+=`<div class="panel"><h2>四、少量阅读理解（3题）</h2>
<div class="q"><span class="num">1.</span>“信赖，往往创造出美好的境界。”这句话说明了什么？<textarea id="r1" placeholder="用自己的话写1—2句即可"></textarea></div>
<div class="q"><span class="num">2.</span>《落花生》中，父亲为什么把花生和桃子、石榴、苹果作比较？<textarea id="r2" placeholder="提示：想想“外表”和“有用”"></textarea></div>
<div class="q"><span class="num">3.</span>你从《慈母情深》或《父爱之舟》中感受到父母怎样的爱？<textarea id="r3" placeholder="写出自己的理解即可"></textarea></div>
</div>`;
 form.innerHTML=sec;
}
function submitExam(){
 const spell=all.filter(x=>x.type==="spell"), choice=all.filter(x=>x.type==="choice"), fill=all.filter(x=>x.type==="fill");
 let correct=0,total=spell.length+choice.length+fill.length,wrong=[];
 spell.forEach((x,i)=>{let v=norm(document.getElementById("s"+i)?.value);if(v===norm(x.a))correct++;else wrong.push({...x,user:document.getElementById("s"+i)?.value||"（未作答）"});});
 choice.forEach((x,i)=>{let v=document.querySelector(`input[name="c${i}"]:checked`);if(v&&+v.value===x.a)correct++;else wrong.push({...x,user:v?String.fromCharCode(65+(+v.value)):"（未作答）"});});
 fill.forEach((x,i)=>{let v=norm(document.getElementById("f"+i)?.value);if(v===norm(x.a))correct++;else wrong.push({...x,user:document.getElementById("f"+i)?.value||"（未作答）"});});
 const pct=Math.round(correct/total*100);
 document.getElementById("result").style.display="block";
 document.getElementById("score").textContent=`${correct} / ${total}　（${pct}分）`;
 document.getElementById("bar").style.width=pct+"%";
 document.getElementById("summary").innerHTML=`<p>答对 <b>${correct}</b> 题，错题 <b>${wrong.length}</b> 题。</p>`+
 (pct>=90?"<div class='right'>🌟 基础掌握得很好！继续保持。</div>":pct>=75?"<div class='right'>👍 基础不错，把错题再练一遍会更稳。</div>":"<div class='wrong'>💪 这次先不追求快。重点把生字词语错题重新写3遍，再做一次。</div>");
 document.getElementById("wrongList").innerHTML=wrong.length?wrong.map((x,i)=>`
 <div class="wrong"><b>${i+1}. ${x.lesson}</b><br>
 ${x.type==="spell"?`拼音：<b>${x.p}</b><br>你的答案：<del>${x.user}</del><br>正确答案：<b>${x.a}</b>`:`题目：${x.q}<br>你的答案：<del>${x.user}</del><br>正确答案：<b>${x.type==="choice"?String.fromCharCode(65+x.a)+". "+x.opts[x.a]:x.a}</b>`}
 <div class="tip">🧠 <b>记忆小老师：</b>${x.tip}</div></div>`).join(""):"<div class='right'>🎉 全部答对！没有错题。</div>";
 window.scrollTo({top:document.getElementById("result").offsetTop-10,behavior:"smooth"});
}
function resetExam(){location.reload();}
function retryWrong(){alert("错题专项练习功能：建议先把上面的“错误答案→正确答案→记忆小老师”读一遍，再回到试卷重新作答。");}
renderLessons();renderExam();
</script>

</html>
